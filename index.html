<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- PWA Viewport Configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>Wcommerce - Plataforma E-commerce</title>
    <meta name="description" content="Plataforma de comercio electrónico versátil y moderna para cualquier rubro." />
    
    <!-- PWA Manifest and Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    
    <!-- iOS PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wcommerce" />
    
    <!-- Windows PWA Settings -->
    <meta name="msapplication-TileImage" content="/icon.png" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="application-name" content="Wcommerce" />
    
    <!-- Open Graph / Social -->
    <meta property="og:title" content="Wcommerce" />
    <meta property="og:description" content="Plataforma de e-commerce." />
    <meta property="og:type" content="website" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#2563EB" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
